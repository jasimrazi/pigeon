queue = "pigeon-jobs-staging"

[[env.staging.queues.consumers]]
queue = "pigeon-jobs-staging"
max_batch_size = 10
max_batch_timeout = 5

[env.prod]
name = "pigeon-worker-prod"
vars = { ENV = "prod", DRY_RUN = "true", DEV_RECIPIENT_ALLOWLIST = "" }

[env.prod.ai]
binding = "AI"

[[env.prod.d1_databases]]
binding = "DB"
database_name = "pigeon-db-prod"
database_id = "343fe5de-98b8-4526-80b0-372d7fa933f0"

[[env.prod.kv_namespaces]]
binding = "CONFIG"
id = "dbaa227e023b4dccab1049cea786d514"

[[env.prod.queues.producers]]
binding = "JOBS_QUEUE"
queue = "pigeon-jobs-prod"

[[env.prod.queues.consumers]]
queue = "pigeon-jobs-prod"
max_batch_size = 10
max_batch_timeout = 5
