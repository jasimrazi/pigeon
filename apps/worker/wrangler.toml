name = "pigeon-worker"
main = "src/index.ts"
compatibility_date = "2024-09-23"

[observability]
enabled = true

[triggers]
crons = ["0 */3 * * *", "*/10 * * * *", "*/15 * * * *"]

[vars]
ENV = "dev"
DRY_RUN = "true"
DEV_RECIPIENT_ALLOWLIST = ""

[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "pigeon-db"
database_id = "00000000-0000-0000-0000-000000000000"

[[kv_namespaces]]
binding = "CONFIG"
id = "pigeon-config"

[[queues.producers]]
binding = "JOBS_QUEUE"
queue = "pigeon-jobs"

[[queues.consumers]]
queue = "pigeon-jobs"
max_batch_size = 10
max_batch_timeout = 5

[env.dev]
name = "pigeon-worker"
vars = { ENV = "dev", DRY_RUN = "true", DEV_RECIPIENT_ALLOWLIST = "" }

[env.dev.ai]
binding = "AI"

[[env.dev.d1_databases]]
binding = "DB"
database_name = "pigeon-db"
database_id = "00000000-0000-0000-0000-000000000000"

[[env.dev.kv_namespaces]]
binding = "CONFIG"
id = "pigeon-config"

[[env.dev.queues.producers]]
binding = "JOBS_QUEUE"
queue = "pigeon-jobs"

[[env.dev.queues.consumers]]
queue = "pigeon-jobs"
max_batch_size = 10
max_batch_timeout = 5

[env.staging]
name = "pigeon-worker-staging"
vars = { ENV = "staging", DRY_RUN = "true", DEV_RECIPIENT_ALLOWLIST = "" }

[env.staging.ai]
binding = "AI"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "pigeon-db-staging"
database_id = "staging-d1-id"

[[env.staging.kv_namespaces]]
binding = "CONFIG"
id = "staging-kv-id"

[[env.staging.queues.producers]]
